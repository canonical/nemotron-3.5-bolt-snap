name: nemotron-3-5-bolt-iq2-xxs

description: |
  Nemotron-3.5-Bolt-74B-A9B is a Mixture of Experts (MoE) large language model compressed
  from Nemotron-3.5-Super-VL. The routed and shared experts are quantized to IQ2_XXS,
  the Mamba layers are kept in NVFP4 and the LM head is in Q8_0.
quantization: IQ2_XXS

disk-size: 26G

capabilities:
  - text
  - vision
  - thinking
  - tools

components:
  - model-74b-a9b-iq2-xxs-1-of-5
  - model-74b-a9b-iq2-xxs-2-of-5
  - model-74b-a9b-iq2-xxs-3-of-5
  - model-74b-a9b-iq2-xxs-4-of-5
  - model-74b-a9b-iq2-xxs-5-of-5
  - mmproj-74b-a9b-bf16-gguf

environment:
  # The model is split into 5 shards, each in its own component to stay below the component size limit.
  # llama.cpp expects all shards in the same directory, so the layout symlinks them into MODELS_DIR.
  - MODELS_DIR=/tmp/nemotron-3-5-bolt-iq2-xxs-shards
  - MODEL_FILE=$MODELS_DIR/nemotron-3-5-bolt-iq2-xxs-00001-of-00005.gguf
  - MMPROJ_FILE=$SNAP_COMPONENTS/mmproj-74b-a9b-bf16-gguf/mmproj-bf16.gguf

layout:
  $MODELS_DIR/nemotron-3-5-bolt-iq2-xxs-00001-of-00005.gguf:
    symlink: $SNAP_COMPONENTS/model-74b-a9b-iq2-xxs-1-of-5/nemotron-3-5-bolt-iq2-xxs-00001-of-00005.gguf
  $MODELS_DIR/nemotron-3-5-bolt-iq2-xxs-00002-of-00005.gguf:
    symlink: $SNAP_COMPONENTS/model-74b-a9b-iq2-xxs-2-of-5/nemotron-3-5-bolt-iq2-xxs-00002-of-00005.gguf
  $MODELS_DIR/nemotron-3-5-bolt-iq2-xxs-00003-of-00005.gguf:
    symlink: $SNAP_COMPONENTS/model-74b-a9b-iq2-xxs-3-of-5/nemotron-3-5-bolt-iq2-xxs-00003-of-00005.gguf
  $MODELS_DIR/nemotron-3-5-bolt-iq2-xxs-00004-of-00005.gguf:
    symlink: $SNAP_COMPONENTS/model-74b-a9b-iq2-xxs-4-of-5/nemotron-3-5-bolt-iq2-xxs-00004-of-00005.gguf
  $MODELS_DIR/nemotron-3-5-bolt-iq2-xxs-00005-of-00005.gguf:
    symlink: $SNAP_COMPONENTS/model-74b-a9b-iq2-xxs-5-of-5/nemotron-3-5-bolt-iq2-xxs-00005-of-00005.gguf
