name: nemotron-3.5-bolt-e4b
description: |
  Nemotron 3.5 Bolt E4B quantized to Q4_K_M.
model-card-url: https://huggingface.co/inference-snaps/Nemotron-3.5-Bolt-5GB
quantization: Q4_K_M
disk-size: 5623M
capabilities:
  - text
  - vision
  - thinking
  - tools
components:
  - model-e4b-q4-k-m-1-of-2
  - model-e4b-q4-k-m-2-of-2
  - mmproj-e4b-q8-0
environment:
  - MODEL_PARTS_DIR=/tmp/model-e4b-q4-k-m-parts
  - MODEL_FILE=$MODEL_PARTS_DIR/NVIDIA-Nemotron-3.5-Bolt-E4B-Q4_K_M-00001-of-00002.gguf
  - MMPROJ_FILE=$SNAP_COMPONENTS/mmproj-e4b-q8-0/NVIDIA-Nemotron-3.5-Bolt-E4B-mmproj-Q8_0.gguf
layout:
  $MODEL_PARTS_DIR/NVIDIA-Nemotron-3.5-Bolt-E4B-Q4_K_M-00001-of-00002.gguf:
    symlink: $SNAP_COMPONENTS/model-e4b-q4-k-m-1-of-2/NVIDIA-Nemotron-3.5-Bolt-E4B-Q4_K_M-00001-of-00002.gguf
  $MODEL_PARTS_DIR/NVIDIA-Nemotron-3.5-Bolt-E4B-Q4_K_M-00002-of-00002.gguf:
    symlink: $SNAP_COMPONENTS/model-e4b-q4-k-m-2-of-2/NVIDIA-Nemotron-3.5-Bolt-E4B-Q4_K_M-00002-of-00002.gguf
 